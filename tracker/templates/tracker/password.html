{% extends "tracker/base.html" %}
{% block title %}Change password · CurtainCall{% endblock %}
{% block content %}
<section class="narrow card">
  <h1 style="font-size:1.75rem;margin-bottom:1rem">Change password</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <label>{{ field.label }}
        <input type="password" name="{{ field.html_name }}" autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}" required>
      </label>
      {% for error in field.errors %}<p class="error small">{{ error }}</p>{% endfor %}
    {% endfor %}
    <button class="button">Change password</button>
  </form>
</section>
{% endblock %}
